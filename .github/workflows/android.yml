name: Android CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set PYTHON_PATH for Chaquopy
        run: echo "PYTHON_PATH=$(which python)" >> $GITHUB_ENV

      - name: Install Android 36 SDK and Build Tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          yes | $SDKMANAGER --licenses || true
          yes | $SDKMANAGER "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Tests, Lint and Assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease -PPYTHON_PATH="$(which python)" --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lyrune-debug
          path: app/build/outputs/apk/debug/Lyrune-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: lyrune-release
          path: app/build/outputs/apk/release/Lyrune.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/release/Lyrune.apk
            app/build/outputs/apk/debug/Lyrune-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
